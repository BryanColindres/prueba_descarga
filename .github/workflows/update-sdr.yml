name: Actualizar valoración del SDR (FMI)

on:
  schedule:
    # 12:30 UTC ~ 06:30 hora Honduras (CST, UTC-6). Ajusta si lo necesitas.
    - cron: "30 12 * * 1-5"   # lunes a viernes (el FMI no publica en fines de semana/feriados)
  workflow_dispatch: {}        # permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write   # necesario para que el workflow pueda hacer commit al repo

jobs:
  update-sdr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Descargar datos del FMI
        run: python scripts/download_sdr.py

      - name: Commitear cambios (si los hay)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Actualiza valoración del SDR ($(date -u +%Y-%m-%d))"
          git push
